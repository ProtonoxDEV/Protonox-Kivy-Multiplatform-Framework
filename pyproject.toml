[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protonox-studio"
version = "0.1.6"
description = "Normalized Protonox Kivy toolchain, templates, and build utilities"
authors = [ { name = "Juan David Morales - Protonox" } ]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["kivy", "android", "buildozer", "python-for-android", "pyjnius"]
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]
dependencies = [
  "kivy>=2.3.0",
  "requests>=2.31.0",
  "buildozer>=1.5.0",
  "cython>=3.0.0,<=3.3.0",
  "setuptools>=65.0.0",
  "wheel>=0.40.0",
]

[project.optional-dependencies]
# Install with Kivy integration: pip install "protonox-studio[kivy]"
kivy = [
  "protonox-kivy>=3.0.0,<4",
  "kivy>=2.3.0",
]

scripts = { protonox = "protonox.__main__:main" }

[project.urls]
Homepage = "https://example.com/protonox"
Documentation = "https://example.com/protonox/docs"
Source = "https://example.com/protonox/repo"

[tool.setuptools]
include-package-data = true
packages = []
